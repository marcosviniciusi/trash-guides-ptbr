# docker-compose.yml
version: '3.8'

services:
  autobrr-proxy:
    image: marcosviniciusi/autobrr-proxy-br:latest
    container_name: autobrr-proxy-br
    
    ports:
      - "${PROXY_PORT:-8888}:8888"
    
    # ✅ Carrega TODAS as variáveis do arquivo .env
    env_file:
      - .env
    
    networks:
      - media
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  media:
    external: true