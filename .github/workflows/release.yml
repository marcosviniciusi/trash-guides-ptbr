name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao (ex: v1.0.0)'
        required: true
      branch:
        description: 'Branch para release'
        required: true
        default: 'alpha'
      prerelease:
        description: 'Marcar como pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar versao e contexto
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            # Tags com -alpha ou -beta sao pre-release
            if echo "$TAG" | grep -qE '-(alpha|beta|rc)'; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}

      - name: Preparar assets
        run: |
          # ZIPs
          cd custom-formats && zip -j ../custom-formats.zip *.json && cd ..
          cd configarr && zip -j ../configarr-configs.zip *.yaml && cd ..
          zip -r trash-guides-ptbr-completo.zip \
            custom-formats/ \
            configarr/ \
            prowlarr-indexes/ \
            iac/

          # Docker compose com nomes claros
          cp iac/docker-compose/manual/docker-compose.yaml docker-compose-manual.yaml
          cp iac/docker-compose/automatico/docker-compose.yaml docker-compose-automatico.yaml

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            custom-formats/*.json
            configarr/*.yaml
            custom-formats.zip
            configarr-configs.zip
            trash-guides-ptbr-completo.zip
            docker-compose-manual.yaml
            docker-compose-automatico.yaml
            iac/docker-compose/manual/download-custom-formats.sh
